# Continuous Integration workflow
# Runs on every push and PR

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install numpy scipy sympy cotengra opt_einsum
          pip install tl-tensor
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Test imports
        run: |
          python -c "from tl_examples import compute_jones, identify_braid; print('OK')"

  test-with-snappy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with SnaPPy
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install numpy scipy sympy cotengra opt_einsum
          pip install tl-tensor
          pip install snappy || echo "SnaPPy install failed, continuing"
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
