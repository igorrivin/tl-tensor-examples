# Monthly Maintenance Workflow
#
# Runs monthly to test with latest dependencies.
# If tests fail, uses Claude Code to diagnose and fix issues,
# then creates a PR with the fixes.
#
# This addresses the "bitrot problem" common in scientific packages.

name: Monthly Maintenance

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test-latest-deps:
    runs-on: ubuntu-latest
    outputs:
      tests_failed: ${{ steps.run-tests.outputs.failed }}
      error_log: ${{ steps.run-tests.outputs.error_log }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Install latest versions (no version pinning)
          pip install --upgrade numpy scipy sympy cotengra opt_einsum
          pip install --upgrade tl-tensor
          pip install --upgrade snappy || echo "SnaPPy unavailable"
          pip install -e .

      - name: Run tests and capture output
        id: run-tests
        run: |
          set +e  # Don't exit on error
          pytest tests/ -v --tb=long 2>&1 | tee test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            # Capture error log (base64 encoded to handle multiline)
            echo "error_log<<EOF" >> $GITHUB_OUTPUT
            cat test_output.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

          exit $TEST_EXIT_CODE
        continue-on-error: true

      - name: Upload test output
        if: steps.run-tests.outputs.failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.txt

  claude-fix:
    needs: test-latest-deps
    if: needs.test-latest-deps.outputs.tests_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download test output
        uses: actions/download-artifact@v4
        with:
          name: test-output

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade numpy scipy sympy cotengra opt_einsum
          pip install --upgrade tl-tensor
          pip install -e .

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code to fix issues
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Create a prompt file with context
          cat > fix_prompt.txt << 'PROMPT_EOF'
          The monthly dependency update has caused test failures. Please:

          1. Read the test output to understand what's failing
          2. Investigate the relevant source files
          3. Fix the issues while maintaining backward compatibility
          4. Run the tests to verify fixes work

          Test output is in test_output.txt

          Focus on:
          - API changes in dependencies (numpy, scipy, sympy, cotengra, tl-tensor, snappy)
          - Deprecation warnings that became errors
          - Type annotation issues with newer Python

          After fixing, verify with: pytest tests/ -v
          PROMPT_EOF

          # Run Claude Code with the fix prompt
          claude-code --print "$(cat fix_prompt.txt)" --yes --max-turns 20 || true

      - name: Run tests after fix
        id: verify-fix
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Create Pull Request
        if: steps.verify-fix.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: Update for compatibility with latest dependencies"
          title: "[Auto] Fix compatibility with latest dependencies"
          body: |
            ## Automated Maintenance PR

            This PR was automatically generated by the monthly maintenance workflow.

            ### What happened
            The scheduled test with latest dependencies failed. Claude Code was used to
            diagnose and fix the issues.

            ### Changes
            - Updated code for compatibility with latest dependency versions
            - All tests now pass

            ### Review checklist
            - [ ] Changes look reasonable
            - [ ] No unintended modifications
            - [ ] Tests pass in CI

            ---
            🤖 Generated with [Claude Code](https://claude.ai/claude-code)
          branch: auto-fix/monthly-maintenance
          delete-branch: true
          labels: |
            automated
            maintenance
            dependencies

      - name: Create Issue if fix failed
        if: steps.verify-fix.outcome != 'success'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "[Auto] Monthly maintenance failed - manual intervention needed"
          content-filepath: test_output.txt
          labels: |
            bug
            maintenance
            help wanted

  notify-success:
    needs: test-latest-deps
    if: needs.test-latest-deps.outputs.tests_failed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Log success
        run: |
          echo "✅ Monthly maintenance check passed!"
          echo "All tests pass with latest dependencies."
